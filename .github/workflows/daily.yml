name: Publicar

on:
  schedule:
    # UTC, cada 10 min de 05:03 a 20:53 (07:00 a 22:53 en horario de verano).
    # GitHub descarta o retrasa muchas pasadas programadas (aterrizan ~10 %),
    # así que se piden muchas para que alguna caiga cerca de la hora. Cada
    # ejecución publica lo que ya toque según el plan del día y no hace nada
    # si no hay nada.
    - cron: "3,13,23,33,43,53 5-20 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "simulacro = solo dibuja el día entero · comprobar = sube una imagen y Instagram la valida, sin publicar · normal = publica lo que toque"
        type: choice
        options: [simulacro, comprobar, normal]
        default: simulacro

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    # Windows: las tarjetas usan Segoe UI y Segoe UI Emoji, que solo vienen ahí.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar fuentes
        run: python -c "import pathlib,sys; ok=[pathlib.Path(r'C:\Windows\Fonts',f).exists() for f in ('segoeui.ttf','segoeuib.ttf','seguisb.ttf','seguiemj.ttf')]; print(ok); sys.exit(0 if all(ok) else 1)"
      - name: Identidad de git
        shell: bash
        run: |
          git config user.name "sudokufight-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Publicar lo que toque ahora
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          case "${{ inputs.modo }}" in
            simulacro) python run_daily.py --dry-run --at 23:59 ;;
            comprobar) python publish.py --check ;;
            *)         python run_daily.py ;;
          esac
      - name: Guardar estado
        if: always()
        shell: bash
        run: |
          git add history.json public
          git diff --cached --quiet || (git commit -m "estado $(date -u +%F)" && git pull --rebase --quiet && git push)
